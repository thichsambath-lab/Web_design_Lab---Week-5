<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 - Responsive Grid Areas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header>Header</header>
    <aside class="sidebar-one">Sidebar</aside>
    <main>
      <h1>Content</h1>
      <p>More content than we had before, so this column is now quite tall. CSS Grid areas make it easy to rearrange this page at different screen sizes.</p>
    </main>
    <aside class="sidebar-two">Sidebar 2</aside>
    <footer>Footer</footer>
  </div>
</body>
</html>
